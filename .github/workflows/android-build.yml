name: Android Build & Release

env:
  main_project_module: app

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*.*.*'
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set current date
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ── Firebase config (injected from secret, never committed) ──────────────
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > ${{ env.main_project_module }}/google-services.json

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test

      # ── Debug APK (always built, no signing required) ────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ── Release signing setup (only when keystore secret is present) ─────────
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ env.main_project_module }}/keystore.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/android/${{ env.main_project_module }}/keystore.jks" >> $GITHUB_ENV

      # ── Release APK ──────────────────────────────────────────────────────────
      - name: Build release APK
        # env:
        #   KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        #   KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        #   KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: ./gradlew assembleRelease

      # ── Release AAB ──────────────────────────────────────────────────────────
      - name: Build release AAB
        # env:
        #   KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        #   KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        #   KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: ./gradlew ${{ env.main_project_module }}:bundleRelease

      # ── Upload artifacts (available on every run) ────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }}-${{ env.repository_name }}-debug.apk
          path: android/${{ env.main_project_module }}/build/outputs/apk/debug/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }}-${{ env.repository_name }}-release.apk
          path: android/${{ env.main_project_module }}/build/outputs/apk/release/

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }}-${{ env.repository_name }}-release.aab
          path: android/${{ env.main_project_module }}/build/outputs/bundle/release/

      # ── GitHub Release (only on version tags like v1.0.0) ────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk
            android/${{ env.main_project_module }}/build/outputs/apk/release/app-release*.apk
            android/${{ env.main_project_module }}/build/outputs/bundle/release/app-release*.aab
