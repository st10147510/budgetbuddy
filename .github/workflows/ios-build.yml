name: iOS Build & Test

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*.*.*'
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  # ── Unit tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Install xcodegen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create dummy GoogleService-Info.plist
        # Real plist is in .gitignore. Firebase initialises at app launch
        # (AppDelegate.application(_:didFinishLaunchingWithOptions:)); unit
        # tests run in a hosted process so this plist must exist and be
        # structurally valid, but the credentials need not be real.
        run: |
          cat > BudgetBuddy/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSy-fake-key-for-ci-only</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>co.za.thebudgetbuddy</string>
            <key>PROJECT_ID</key>
            <string>budgetbuddy-ci</string>
            <key>STORAGE_BUCKET</key>
            <string>budgetbuddy-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000000000</string>
            <key>CLIENT_ID</key>
            <string>000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</string>
          </dict>
          </plist>
          EOF

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project BudgetBuddy.xcodeproj \
            -scheme BudgetBuddy \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --report junit --output test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/test-results/

  # ── Simulator build ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: macos-15
    needs: test
    if: github.event_name != 'pull_request'

    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set metadata
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Install xcodegen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create dummy GoogleService-Info.plist
        run: |
          cat > BudgetBuddy/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSy-fake-key-for-ci-only</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>co.za.thebudgetbuddy</string>
            <key>PROJECT_ID</key>
            <string>budgetbuddy-ci</string>
            <key>STORAGE_BUCKET</key>
            <string>budgetbuddy-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000000000</string>
            <key>CLIENT_ID</key>
            <string>000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</string>
          </dict>
          </plist>
          EOF

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # ── Debug simulator build (always, no signing) ────────────────────────────
      - name: Build debug (simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BudgetBuddy.xcodeproj \
            -scheme BudgetBuddy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Debug-simulator \
            | xcpretty

      - name: Zip simulator .app
        run: |
          cd build/Debug-simulator
          zip -r ../../BudgetBuddy-simulator.zip BudgetBuddy.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }}-${{ env.repository_name }}-simulator.zip
          path: ios/BudgetBuddy-simulator.zip

