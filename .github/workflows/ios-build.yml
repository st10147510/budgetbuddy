          name: ${{ env.date_today }}-${{ env.repository_name }}-release.ipa
          path: ${{ runner.temp }}/IPA/*.ipa

  # ── GitHub Release (on version tags only) ────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set metadata
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Download simulator build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.date_today }}-${{ env.repository_name }}-simulator.zip
          path: artifacts/

      - name: Download IPA (if present)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.date_today }}-${{ env.repository_name }}-release.ipa
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
