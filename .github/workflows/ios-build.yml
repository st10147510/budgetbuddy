      #     set -o pipefail
      #     xcodebuild archive \
      #       -project BudgetBuddy.xcodeproj \
      #       -scheme BudgetBuddy \
      #       -configuration Release \
      #       -destination 'generic/platform=iOS' \
      #       -archivePath $RUNNER_TEMP/BudgetBuddy.xcarchive \
      #       | xcpretty

      # - name: Export IPA
      #   if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      #   env:
      #     CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
